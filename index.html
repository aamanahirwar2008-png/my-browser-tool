<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Browser Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      padding: 12px;
      margin: 8px 4px;
      font-size: 16px;
    }

    #timer {
      font-size: 48px;
      margin: 20px;
    }
  </style>
</head>
<body>

  <h2>My Browser Tool</h2>

  <input id="url" placeholder="Website URL डालो">

  <button onclick="openSite()">Open Website</button>

  <div id="timer">30</div>

  <button onclick="changeTime(-15)">−15 सेकंड</button>
  <button onclick="changeTime(15)">+15 सेकंड</button>
  <br>
  <button onclick="startTimer()">Start</button>
  <button onclick="pauseTimer()">Pause</button>
  <button onclick="resetTimer()">Reset</button>

  <script>
    let time = 30;
    let interval = null;

    function showTime() {
      document.getElementById("timer").innerText = time;
    }

    function openSite() {
      let url = document.getElementById("url").value.trim();

      if (!url) {
        alert("पहले URL डालो");
        return;
      }

      if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
      }

      window.open(url, "_blank");
    }

    function changeTime(value) {
      time = Math.max(0, time + value);
      showTime();
    }

    function startTimer() {
      if (interval !== null) return;

      interval = setInterval(() => {
        if (time > 0) {
          time--;
          showTime();
        } else {
          pauseTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(interval);
      interval = null;
    }

    function resetTimer() {
      pauseTimer();
      time = 30;
      showTime();
    }
  </script>

</body>
</html>
